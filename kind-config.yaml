kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # etykieta ingress-ready pozwala nginx ingress controllerowi uruchomić się na tym węźle
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # ruch HTTP z hosta (localhost:8080) trafia do ingress controllera
      # port 8080 zamiast 80, bo 80 jest zajęty przez klaster projektu z chmurowych
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      # ruch HTTPS z hosta (localhost:8443)
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
