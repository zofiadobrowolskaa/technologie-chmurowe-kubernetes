apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            # nazwa bazy pochodzi z ConfigMap
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DB_NAME
            # użytkownik i hasło pobierane z Secret (dane wrażliwe)
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # pvc w katalogu danych pg - dane przetrwają restart poda
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      # wolumen wskazuje na pvc - kubernetes przydzieli fizyczną przestrzeń dyskową
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
