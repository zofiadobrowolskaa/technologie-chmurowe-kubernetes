name: CI

on:
  push:
    branches: [main]
    # pipeline uruchamia się też przy pushu taga wersji (np. v2.0.0)
    tags: ['v*']

# jawne uprawnienia wymagane przez ghcr.io - bez packages:write token nie może pushować obrazów
permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zaloguj do ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wygeneruj tagi obrazu
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          # tagi: zawsze SHA commita, na pushu taga dodatkowo wersja (v2.0.0), na main latest
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Zbuduj i opublikuj obraz
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Uruchom klaster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: test-cluster

      - name: Załaduj obraz do kind
        run: |
          docker pull ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          kind load docker-image \
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }} \
            --name test-cluster

      - name: Wdróż system
        run: |
          kubectl apply -f k8s/postgres/
          kubectl apply -f k8s/backend/
          # podmieniamy obraz w obu deploymentach blue-green na świeżo zbudowany
          kubectl set image deployment/backend-blue \
            backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          kubectl set image deployment/backend-green \
            backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Poczekaj na gotowość Podów
        run: |
          kubectl rollout status deployment/postgres --timeout=120s
          kubectl rollout status deployment/backend-blue --timeout=120s
          kubectl rollout status deployment/backend-green --timeout=120s

      - name: Test HTTP
        run: |
          kubectl port-forward service/backend-service 8080:8080 &
          sleep 5
          curl --fail http://localhost:8080/health
